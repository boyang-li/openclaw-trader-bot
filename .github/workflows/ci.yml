name: CI/CD

on:
  push:
    branches: [main, l1-ingestion]

env:
  GO_VERSION: "1.23"

jobs:
  # --- 原有的测试逻辑保持不变，利用 GitHub 算力 ---
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Build binaries
        run: make build

  # --- 新增部署逻辑：在 Trigkey 本机运行 ---
  deploy:
    name: Deploy to Trigkey
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        # 这一步会在执行 docker compose 之前，把 GitHub 里的加密变量写进文件
        run: |
          echo "${{ secrets.DOTENV_FILE }}" > ./deploy/.env
          # 为了安全，修改权限只允许当前用户读取
          chmod 600 ./deploy/.env

      - name: Deploy with Docker Compose
        run: |
          # 打印当前目录内容，以便在日志中二次确认路径
          echo "Scanning for docker-compose in ./deploy..."
          ls -la ./deploy

          # 使用 -f 明确指向文件位置
          # --project-directory . 确保 Docker 在构建时能找到项目根目录的代码
          docker compose -f ./deploy/docker-compose.yml down --remove-orphans
          docker compose --env-file .env -f ./deploy/docker-compose.yml up -d --build

      - name: Cleanup dangling images
        run: docker image prune -f
