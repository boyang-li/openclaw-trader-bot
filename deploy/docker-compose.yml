# =============================================================================
# ACC L1-Ingestion: Docker Compose Stack
# =============================================================================
# Version: 2.0 (Redpanda-based, fully containerized)
# 
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Services:
#   - Redpanda (Kafka-compatible broker)
#   - Go Providers (GDELT, FRED, Binance, COT)
#   - Prometheus + Grafana (Observability)
#   - Redis (Rate limiting, caching)
#
# Ports:
#   - 8081: GDELT provider health
#   - 8082: FRED provider health
#   - 8083: Binance provider health
#   - 8085: COT provider health
#   - 9092: Redpanda Kafka API
#   - 8082: Redpanda REST Proxy (internal)
#   - 9644: Redpanda Admin API
#   - 9090: Prometheus
#   - 3000: Grafana
#   - 6379: Redis
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # Message Broker: Redpanda (Kafka-compatible, single binary, no Zookeeper)
  # ===========================================================================
  redpanda:
    image: redpandadata/redpanda:v23.3.5
    container_name: l1-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "9092:9092"     # Kafka API
      - "9644:9644"     # Admin API
      - "8082:8082"     # REST Proxy (Pandaproxy)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - l1-network

  # ===========================================================================
  # Topic Initialization (runs once)
  # ===========================================================================
  redpanda-init:
    image: redpandadata/redpanda:v23.3.5
    container_name: l1-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo 'Creating topics...'
        rpk topic create l1.signals.raw --brokers redpanda:9092 --partitions 6 --config retention.ms=604800000 --config max.message.bytes=10485760 || true
        rpk topic create l1.signals.enriched --brokers redpanda:9092 --partitions 6 --config retention.ms=604800000 || true
        rpk topic create l1.signals.filtered --brokers redpanda:9092 --partitions 3 --config retention.ms=2592000000 || true
        rpk topic create l1.signals.dlq --brokers redpanda:9092 --partitions 1 --config retention.ms=2592000000 || true
        echo 'Topics created:'
        rpk topic list --brokers redpanda:9092
    networks:
      - l1-network

  # ===========================================================================
  # Go Provider Services (Free APIs only for MVP)
  # ===========================================================================
  
  # GDELT - Global Event Database (Geopolitical)
  gdelt:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.provider
      args:
        PROVIDER: gdelt
    container_name: l1-gdelt
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - L1_KAFKA_BROKERS=redpanda:9092
      - L1_KAFKA_TOPIC_RAW=l1.signals.raw
      - L1_GDELT_ENABLED=true
      - L1_GDELT_POLL_INTERVAL=${GDELT_POLL_INTERVAL:-15m}
      - L1_LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - l1-network

  # FRED - Federal Reserve Economic Data (Macro)
  fred:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.provider
      args:
        PROVIDER: fred
    container_name: l1-fred
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - L1_KAFKA_BROKERS=redpanda:9092
      - L1_KAFKA_TOPIC_RAW=l1.signals.raw
      - L1_FRED_API_KEY=${FRED_API_KEY:?FRED_API_KEY is required}
      - L1_FRED_POLL_INTERVAL=${FRED_POLL_INTERVAL:-1h}
      - L1_LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - l1-network

  # Binance - Cryptocurrency Market Data (Crypto)
  binance:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.provider
      args:
        PROVIDER: binance
    container_name: l1-binance
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - L1_KAFKA_BROKERS=redpanda:9092
      - L1_KAFKA_TOPIC_RAW=l1.signals.raw
      - L1_BINANCE_PAIRS=${BINANCE_PAIRS:-BTCUSDT,ETHUSDT}
      - L1_BINANCE_LARGE_TRADE_THRESHOLD_USD=${BINANCE_LARGE_TRADE_THRESHOLD:-100000}
      - L1_BINANCE_PRICE_CHANGE_THRESHOLD_PCT=${BINANCE_PRICE_CHANGE_THRESHOLD:-1.0}
      - L1_LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8083:8080"
    restart: unless-stopped
    networks:
      - l1-network

  # CME COT - Commitment of Traders Report (Macro)
  cot:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.provider
      args:
        PROVIDER: cot
    container_name: l1-cot
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - L1_KAFKA_BROKERS=redpanda:9092
      - L1_KAFKA_TOPIC_RAW=l1.signals.raw
      - L1_COT_ENABLED=true
      - L1_COT_POLL_INTERVAL=${COT_POLL_INTERVAL:-6h}
      - L1_LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8085:8080"
    restart: unless-stopped
    networks:
      - l1-network

  # ===========================================================================
  # Python SLM Worker (Signal Enrichment)
  # ===========================================================================
  slm-worker:
    build:
      context: ../python
      dockerfile: Dockerfile
    container_name: l1-slm-worker
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - INPUT_TOPIC=l1.signals.raw
      - OUTPUT_TOPIC=l1.signals.enriched
      - DLQ_TOPIC=l1.signals.dlq
      - CONSUMER_GROUP=slm-worker
      - MODEL_NAME=${SLM_MODEL_NAME:-Qwen/Qwen2.5-1.5B-Instruct}
      - DEVICE=${SLM_DEVICE:-cpu}
      - BATCH_SIZE=${SLM_BATCH_SIZE:-5}
      - USE_4BIT=${SLM_USE_4BIT:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - huggingface-cache:/app/.cache/huggingface
    restart: unless-stopped
    networks:
      - l1-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # ===========================================================================
  # Monitoring Stack
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: l1-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - l1-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: l1-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - l1-network

  # ===========================================================================
  # Redis (for rate limiting and caching)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: l1-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - l1-network

# =============================================================================
# Networks
# =============================================================================
networks:
  l1-network:
    driver: bridge
    name: l1-ingestion-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redpanda-data:
  prometheus-data:
  grafana-data:
  redis-data:
  huggingface-cache:
