# =============================================================================
# ACC L1-Ingestion: Docker Compose Stack (Final Optimized Version)
# =============================================================================
# 系统状态：已针对 Trigkey (192.168.2.81) 进行内网穿透优化
# 监控地址：
#   - Redpanda Console: http://192.168.2.81:8080
#   - Grafana: http://192.168.2.81:3000
# =============================================================================

services:
  # ===========================================================================
  # Message Broker: Redpanda
  # ===========================================================================
  redpanda:
    image: redpandadata/redpanda:v23.3.5
    container_name: l1-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      # 内部监听 29092 供容器使用，外部监听 9092 供局域网 M4 使用
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://l1-redpanda:29092,EXTERNAL://192.168.2.81:9092
      - --pandaproxy-addr=INTERNAL://0.0.0.0:28082,EXTERNAL://0.0.0.0:8082
      - --advertise-pandaproxy-addr=INTERNAL://l1-redpanda:28082,EXTERNAL://192.168.2.81:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - l1-network

  # Redpanda 可视化监控 (新增)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: l1-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=l1-redpanda:29092
    ports:
      - "8080:8080"
    networks:
      - l1-network

  # ===========================================================================
  # Go Providers (Data Ingestion)
  # ===========================================================================
  gdelt:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.provider
      args:
        SERVICE_NAME: gdelt
    container_name: l1-gdelt
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - L1_KAFKA_BROKERS=l1-redpanda:29092
      - L1_KAFKA_TOPIC_RAW=l1.signals.raw
    networks:
      - l1-network

  binance:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.provider
      args:
        SERVICE_NAME: binance
    container_name: l1-binance
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - L1_KAFKA_BROKERS=l1-redpanda:29092
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    networks:
      - l1-network

  fred:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.provider
      args:
        SERVICE_NAME: fred
    container_name: l1-fred
    environment:
      - L1_KAFKA_BROKERS=l1-redpanda:29092
    networks:
      - l1-network

  cot:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.provider
      args:
        SERVICE_NAME: cot
    container_name: l1-cot
    environment:
      - L1_KAFKA_BROKERS=l1-redpanda:29092
    networks:
      - l1-network

  # ===========================================================================
  # Python Services (Processing & Storage)
  # ===========================================================================
  slm-worker:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.python
      args:
        SERVICE_NAME: slm_worker
    container_name: l1-slm-worker
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=l1-redpanda:29092
    networks:
      - l1-network

  persister:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.python
      args:
        SERVICE_NAME: persister
    container_name: l1-persister
    environment:
      - KAFKA_BROKER=l1-redpanda:29092
    networks:
      - l1-network

  alerter:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.python
      args:
        SERVICE_NAME: alerter
    container_name: l1-alerter
    environment:
      - KAFKA_BROKER=l1-redpanda:29092
    networks:
      - l1-network

  l2-reasoner:
    build:
      context: ..
      dockerfile: ./build/package/Dockerfile.python
      args:
        SERVICE_NAME: l2_reasoner
    container_name: l2-reasoner
    environment:
      - KAFKA_BROKER=l1-redpanda:29092
    networks:
      - l1-network

  # ===========================================================================
  # Observability & Infrastructure
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: l1-prometheus
    volumes:
      - prometheus-data:/prometheus
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - l1-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: l1-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - l1-network

  redis:
    image: redis:7-alpine
    container_name: l1-redis
    ports:
      - "6379:6379"
    networks:
      - l1-network

networks:
  l1-network:
    driver: bridge
    name: l1-ingestion-network

volumes:
  redpanda-data:
  prometheus-data:
  grafana-data:
  redis-data:
