name: CI/CD

on:
  push:
    branches: [main, l1-ingestion]

env:
  GO_VERSION: "1.23"

jobs:
  # --- 原有的测试逻辑保持不变，利用 GitHub 算力 ---
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Build binaries
        run: make build

  # --- 新增部署逻辑：在 Trigkey 本机运行 ---
  deploy:
    name: Deploy to Trigkey
    needs: test-and-build # 只有测试通过才部署
    if: github.ref == 'refs/heads/main' # 仅限 main 分支触发部署
    runs-on: self-hosted # <--- 核心修改：指定在你的 Trigkey 上运行
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          # 1. 停止旧容器并清理（可选）
          docker compose down
          # 2. 重新构建并后台启动
          # 注意：因为是 self-hosted，它会直接在 Trigkey 物理机执行这行
          docker compose up -d --build

      - name: Cleanup dangling images
        run: docker image prune -f
